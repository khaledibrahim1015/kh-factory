[project]
name = "kh-factory"
version = "0.1.0"
description = "A small software factory: code runs the flow, agents (Pi or Claude Code) do bounded steps."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
factory = "kh_factory.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kh_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
