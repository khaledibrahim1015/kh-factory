<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kh-factory</title>
<style>
  /* Agent steps are round stations, code steps are square ones: "agent proposes, code disposes".
     Safety yellow is reserved for jobs that wait on a human. */
  :root {
    --bg: #e9ece8; --panel: #f7f8f5; --ink: #1c2b30; --muted: #5f6d6a; --line: #c9d0ca; --soft: #dde2dc;
    --agent: #3557a8; --code: #4f5d59; --ok: #2b7a57; --bad: #b3362a; --run: #3557a8;
    --hazard: #f2b705; --hazard-ink: #2a2100; --hazard-soft: #fbefc4;
    --sans: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151d20; --panel: #1c262a; --ink: #e3e9e6; --muted: #93a19d; --line: #2f3c40; --soft: #243034;
      --agent: #86a4ee; --code: #a3b0ac; --ok: #5cc493; --bad: #f2786b; --run: #86a4ee;
      --hazard: #f2b705; --hazard-ink: #2a2100; --hazard-soft: #3a3210;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151d20; --panel: #1c262a; --ink: #e3e9e6; --muted: #93a19d; --line: #2f3c40; --soft: #243034;
    --agent: #86a4ee; --code: #a3b0ac; --ok: #5cc493; --bad: #f2786b; --run: #86a4ee;
    --hazard: #f2b705; --hazard-ink: #2a2100; --hazard-soft: #3a3210;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--agent); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  header .root { color: var(--muted); overflow-wrap: anywhere; }
  header .spacer { margin-left: auto; }
  @media (max-width: 700px) { header { padding: 12px 16px; flex-wrap: wrap; } header .root { order: 9; flex-basis: 100%; font-size: 11px; } }
  .needs-badge { background: var(--hazard); color: var(--hazard-ink); font-weight: 700; font-size: 13px;
                 padding: 3px 10px; border-radius: 3px; white-space: nowrap; }
  .ghost { color: var(--muted); font-size: 13px; padding: 4px 8px; border-radius: 4px; }
  .ghost:hover { background: var(--soft); color: var(--ink); }

  main { display: grid; grid-template-columns: minmax(260px, 330px) 1fr; min-height: calc(100vh - 53px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
  aside { border-right: 1px solid var(--line); padding: 8px 0 24px; overflow: auto; }
  #detail { padding: 20px 28px 40px; min-width: 0; }
  @media (max-width: 800px) { #detail { padding: 16px; } }

  /* job list */
  .group { padding: 14px 20px 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .group b { color: var(--ink); }
  .job { display: block; width: 100%; text-align: left; padding: 9px 20px 9px 17px; border-left: 3px solid transparent; }
  .job:hover { background: var(--soft); }
  .job.sel { background: var(--panel); border-left-color: var(--ink); }
  .job.needs { border-left-color: var(--hazard); }
  .job.needs.sel { background: var(--hazard-soft); }
  .job .t { display: flex; gap: 8px; align-items: baseline; }
  .job .task { font-weight: 700; white-space: nowrap; }
  .job .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job .meta { display: flex; gap: 10px; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .word { font-weight: 600; }
  .word.passed, .word.approved { color: var(--ok); }
  .word.failed, .word.rejected, .word.stalled { color: var(--bad); }
  .word.running, .word.queued { color: var(--run); }
  .word.awaiting-human { background: var(--hazard); color: var(--hazard-ink); padding: 0 5px; border-radius: 2px; }
  .empty { color: var(--muted); padding: 0 20px; }

  /* job head */
  .head h2 { font-size: 26px; line-height: 1.2; font-weight: 600; margin: 0 0 6px; letter-spacing: -.015em; max-width: 34em; }
  .head h2 .task { color: var(--muted); font-weight: 500; margin-right: 8px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); font-size: 13.5px; }
  .facts span b { color: var(--ink); font-weight: 600; }
  .reason { margin: 14px 0 0; padding: 10px 14px; background: var(--panel); border-left: 3px solid var(--bad);
            max-width: 75ch; overflow-wrap: anywhere; white-space: pre-wrap; font-size: 14px; }

  /* the line */
  .line-wrap { margin: 28px 0 0; overflow-x: auto; padding-bottom: 6px; }
  .line { display: flex; align-items: flex-start; min-width: min-content; }
  .station { display: flex; flex-direction: column; align-items: center; width: 74px; flex: none; padding: 4px 0;
             border-radius: 6px; }
  .station:hover { background: var(--soft); }
  .station.sel { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  .mark { width: 22px; height: 22px; border: 2px solid var(--code); background: var(--bg); display: grid; place-items: center;
          font-size: 12px; font-weight: 700; line-height: 1; }
  .station.agent .mark { border-radius: 50%; border-color: var(--agent); }
  .station.code .mark { border-radius: 3px; }
  .station.passed .mark { background: var(--ok); border-color: var(--ok); color: var(--bg); }
  .station.failed .mark { background: var(--bad); border-color: var(--bad); color: var(--bg); }
  .station.running .mark { background: var(--panel); animation: pulse 1.6s ease-out infinite; }
  .station.you .mark { width: 26px; height: 26px; background: var(--hazard); border-color: var(--hazard); color: var(--hazard-ink);
                       clip-path: polygon(50% 0, 100% 100%, 0 100%); border: 0; padding-top: 6px; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 55%, transparent); }
                     100% { box-shadow: 0 0 0 9px transparent; } }
  @media (prefers-reduced-motion: reduce) { .station.running .mark { animation: none; border-style: dashed; } }
  .station .name { font-size: 12.5px; margin-top: 5px; text-align: center; line-height: 1.2; }
  .station .dur { font-size: 11.5px; color: var(--muted); }
  .ctxbar { width: 34px; height: 3px; background: var(--soft); margin-top: 4px; border-radius: 2px; overflow: hidden; }
  .ctxbar i { display: block; height: 100%; background: var(--agent); }
  .ctxbar.warn i { background: var(--bad); }
  .belt { flex: 1 0 14px; height: 2px; background: var(--line); margin-top: 16px; min-width: 14px; }
  .legend { display: flex; gap: 18px; color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--agent); border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .legend i.sq { border-color: var(--code); border-radius: 2px; }

  /* station detail */
  .panel { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; max-width: 900px; }
  .panel h3 { margin: 0 0 4px; font-size: 16px; }
  .panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .panel .text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; max-width: 80ch; }
  .gates { list-style: none; margin: 10px 0 0; padding: 0; }
  .gates li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; padding: 4px 0; border-top: 1px solid var(--soft); font-size: 13.5px; }
  .gates .y { color: var(--ok); font-weight: 700; } .gates .n { color: var(--bad); font-weight: 700; }
  .gates small { color: var(--muted); display: block; overflow-wrap: anywhere; }

  /* your move */
  .yours { margin-top: 18px; border: 2px solid var(--hazard); border-radius: 6px; padding: 14px 16px; max-width: 900px; background: var(--hazard-soft); }
  .yours h3 { margin: 0 0 8px; font-size: 16px; }
  .cmd { display: flex; align-items: center; gap: 10px; padding: 5px 0; flex-wrap: wrap; }
  .cmd code { background: var(--panel); border: 1px solid var(--line); padding: 3px 8px; border-radius: 4px; overflow-wrap: anywhere; }
  .cmd span { color: var(--muted); font-size: 13px; }
  .copy { font-size: 12.5px; color: var(--muted); text-decoration: underline; }

  /* tabs */
  .tabs { display: flex; gap: 22px; margin: 30px 0 0; border-bottom: 1px solid var(--line); }
  .tab { padding: 8px 0; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 600; }
  .tab.on { color: var(--ink); border-bottom-color: var(--ink); }
  .tab .n { font-weight: 400; margin-left: 4px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; font-size: 13px; color: var(--muted); }
  .chip { padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; }
  .chip { color: var(--muted); text-decoration: line-through; }
  .chip.on { color: var(--ink); border-color: var(--ink); text-decoration: none; }

  .events { font-size: 13.5px; }
  .ev { display: grid; grid-template-columns: 64px 76px 1fr; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--soft); }
  @media (max-width: 600px) { .ev { grid-template-columns: 58px 1fr; } .ev .ph { display: none; } }
  .ev time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .ev .ph { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .body { overflow-wrap: anywhere; min-width: 0; white-space: pre-wrap; }
  .ev .kind { font-weight: 600; margin-right: 6px; }
  .ev.message .kind { color: var(--agent); } .ev.tool .kind { color: var(--code); } .ev.result .kind { color: var(--ok); }
  .ev .body code { font-size: 12px; }

  .files { display: grid; grid-template-columns: minmax(180px, 260px) 1fr; gap: 14px; margin-top: 12px; }
  @media (max-width: 700px) { .files { grid-template-columns: 1fr; } }
  .flist button { display: block; width: 100%; text-align: left; padding: 4px 8px; border-radius: 4px; overflow-wrap: anywhere; }
  .flist button:hover { background: var(--soft); }
  .flist button.on { background: var(--ink); color: var(--bg); }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; font: 12.5px/1.5 var(--mono);
        white-space: pre-wrap; overflow-wrap: anywhere; max-height: 70vh; overflow: auto; margin: 0; }
  .start { max-width: 46ch; margin-top: 12vh; color: var(--muted); }
  .start h2 { color: var(--ink); font-size: 22px; margin: 0 0 6px; }
</style>
</head>
<body>
<header>
  <h1>kh-factory</h1><span class="root mono" id="root"></span>
  <span class="spacer"></span>
  <span id="needs"></span>
  <button class="ghost" id="theme">Switch theme</button>
</header>
<main>
  <aside id="jobs"><p class="empty">Loading jobs…</p></aside>
  <section id="detail"><div class="start"><h2>Pick a job</h2>Jobs that wait on you are at the top of the list.</div></section>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = (t) => { if (!t) return "-"; const s = Math.round(Date.now()/1000 - t); return s < 120 ? s+"s ago" : s < 7200 ? Math.round(s/60)+"m ago" : s < 172800 ? Math.round(s/3600)+"h ago" : Math.round(s/86400)+"d ago"; };
const dur = (s) => { s = Math.max(0, Math.round(s)); return s < 60 ? s+"s" : s < 3600 ? `${Math.floor(s/60)}m ${s%60}s` : `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`; };
const k = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(".0", "") + "M" : Math.round(n / 1e3) + "k";
const money = (c) => "$" + (c || 0).toFixed(3);
const label = (s) => s === "awaiting-human" ? "needs you" : s;
const NEEDS = ["awaiting-human", "stalled"], LIVE = ["running", "queued"];

const state = { selected: null, station: null, tab: "activity", kinds: new Set(["message", "tool", "log", "result"]),
                file: null, fileText: "", events: [], lastEvent: 0, jobsSig: "", detailSig: "", detail: null };

try { const t = localStorage.getItem("khf-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme === "dark" ||
    (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  const cur = dark ? "light" : "dark";
  document.documentElement.dataset.theme = cur;
  try { localStorage.setItem("khf-theme", cur); } catch (e) {}
};

/* ---------- job list ---------- */
async function loadJobs() {
  const r = await fetch("/api/jobs").then((r) => r.json());
  const sig = JSON.stringify(r) + state.selected;
  if (sig === state.jobsSig) return;
  state.jobsSig = sig;
  $("#root").textContent = r.root;
  const needs = r.jobs.filter((j) => NEEDS.includes(j.status));
  const live = r.jobs.filter((j) => LIVE.includes(j.status));
  const rest = r.jobs.filter((j) => !NEEDS.includes(j.status) && !LIVE.includes(j.status));
  $("#needs").innerHTML = needs.length ? `<span class="needs-badge">${needs.length} need${needs.length > 1 ? "" : "s"} you</span>` : "";
  document.title = (needs.length ? `(${needs.length}) ` : "") + "kh-factory";
  const row = (j) => `
    <button class="job ${NEEDS.includes(j.status) ? "needs" : ""} ${j.id === state.selected ? "sel" : ""}" data-id="${esc(j.id)}">
      <div class="t"><span class="task">${esc(j.task_id)}</span><span class="title">${esc(j.title)}</span></div>
      <div class="meta"><span class="word ${esc(j.status)}">${esc(label(j.status))}</span><span>${ago(j.updated_at)}</span><span>${money(j.cost_usd)}</span></div>
    </button>`;
  const group = (name, list) => list.length ? `<div class="group"><b>${name}</b> ${list.length}</div>${list.map(row).join("")}` : "";
  $("#jobs").innerHTML = r.jobs.length
    ? group("Needs you", needs) + group("Running", live) + group("Finished", rest)
    : `<p class="empty">No jobs yet. Run <code>factory next</code> in your repo.</p>`;
  $$(".job").forEach((el) => el.onclick = () => select(el.dataset.id));
}

/* ---------- job detail ---------- */
async function select(id) {
  if (state.selected !== id) {
    Object.assign(state, { selected: id, station: null, file: null, fileText: "", events: [], lastEvent: 0, detailSig: "" });
    state.jobsSig = "";
    loadJobs();
  }
  const d = await fetch(`/api/jobs/${encodeURIComponent(id)}`).then((r) => r.json());
  if (!d.job || state.selected !== id) return;
  const sig = JSON.stringify(d);
  const changed = sig !== state.detailSig;
  state.detailSig = sig; state.detail = d;
  const fresh = await loadEvents(id);
  if (changed || (fresh && state.tab === "activity")) render();
  else $$(".station.running .dur").forEach((el) => {    // keep the running clock moving without a full redraw
    const p = d.phases.find((p) => String(p.id) === el.dataset.p);
    if (p) el.textContent = dur(Date.now()/1000 - p.started_at);
  });
}

function stationName(n) { return n.replace(/_(\d+)$/, " $1").replace(/_/g, " "); }

function render() {
  const d = state.detail, j = d.job;
  const gatesBy = {};
  d.gates.forEach((g) => (gatesBy[g.phase_id] ||= []).push(g));
  const total = (j.updated_at || 0) - (j.created_at || 0);
  const failedReason = j.reason && ["failed", "rejected", "stalled"].includes(j.status);

  const stations = d.phases.map((p) => {
    const gs = gatesBy[p.id] || [];
    const pct = p.context_window ? Math.min(100, Math.round(100 * p.context_tokens / p.context_window)) : 0;
    const mark = p.status === "passed" ? "✓" : p.status === "failed" ? "✕" : "";
    const end = p.ended_at || Date.now()/1000;
    return `<div class="belt"></div>
      <button class="station ${esc(p.kind)} ${esc(p.status)} ${state.station === p.id ? "sel" : ""}" data-p="${p.id}"
        title="${esc(p.kind)} step by ${esc(p.owner)}${gs.length ? `, ${gs.filter((g) => g.passed).length}/${gs.length} gates passed` : ""}">
        <span class="mark">${mark}</span>
        <span class="name">${esc(stationName(p.name))}</span>
        <span class="dur" data-p="${p.id}">${dur(end - p.started_at)}</span>
        ${p.kind === "agent" && pct ? `<span class="ctxbar ${pct >= 80 ? "warn" : ""}" title="context ${k(p.context_tokens)} of ${k(p.context_window)}"><i style="width:${pct}%"></i></span>` : ""}
      </button>`;
  }).join("").replace(/^<div class="belt"><\/div>/, "");
  const you = j.status === "awaiting-human"
    ? `<div class="belt"></div><div class="station you"><span class="mark">!</span><span class="name">you</span></div>` : "";

  const sel = d.phases.find((p) => p.id === state.station);
  const panel = sel ? stationPanel(sel, gatesBy[sel.id] || []) : "";
  const yours = j.status === "awaiting-human" ? `
    <div class="yours"><h3>Your move</h3>
      ${cmd(`factory approve ${j.id}`, `Merge ${j.branch || "the branch"} into ${j.base_branch || "its base"}`)}
      ${cmd(`factory rework ${j.id} "<note>"`, "Send it back with a note")}
      ${cmd(`factory reject ${j.id}`, "Drop the job")}
    </div>` : j.status === "stalled" ? `
    <div class="yours"><h3>This job stopped sending heartbeats</h3>
      ${cmd(`factory resume ${j.id}`, "Continue from the last finished step")}
    </div>` : "";

  const shown = state.events.filter((e) => state.kinds.has(e.kind) && (!state.station || e.phase_id === state.station));
  const phaseName = {}; d.phases.forEach((p) => phaseName[p.id] = stationName(p.name));

  $("#detail").innerHTML = `
    <div class="head">
      <h2><span class="task">${esc(j.task_id)}</span>${esc(j.title)}</h2>
      <div class="facts">
        <span class="word ${esc(j.status)}">${esc(label(j.status))}</span>
        <span>Branch <code>${esc(j.branch || "-")}</code></span>
        <span>From <code>${esc(j.base_branch || "-")}@${esc((j.base_sha || "").slice(0, 8))}</code></span>
        <span><b>${money(j.cost_usd)}</b> spent</span>
        <span><b>${dur(total)}</b> total</span>
        ${j.max_context_pct ? `<span>Peak context <b>${Math.round(j.max_context_pct)}%</b></span>` : ""}
        <span class="mono">${esc(j.id)}</span>
      </div>
      ${failedReason ? `<div class="reason">${esc(j.reason)}</div>` : ""}
    </div>
    ${yours}
    <div class="line-wrap"><div class="line">${stations || '<span class="empty" style="padding:0">No steps yet.</span>'}${you}</div></div>
    <div class="legend"><span><i></i>Agent step</span><span><i class="sq"></i>Code step</span><span>Select a step to see its gates and activity.</span></div>
    ${panel}
    <div class="tabs" role="tablist">
      <button class="tab ${state.tab === "activity" ? "on" : ""}" data-tab="activity" role="tab">Activity<span class="n">${state.events.length}</span></button>
      <button class="tab ${state.tab === "files" ? "on" : ""}" data-tab="files" role="tab">Files<span class="n">${d.files.length}</span></button>
    </div>
    ${state.tab === "activity" ? `
      <div class="toolbar">
        ${["message", "tool", "log", "result"].map((x) => `<button class="chip ${state.kinds.has(x) ? "on" : ""}" data-kind="${x}">${x}s</button>`).join("")}
        ${state.station ? `<span>Only ${esc(phaseName[state.station])}.</span><button class="copy" data-clear>Show all steps</button>` : ""}
      </div>
      <div class="events">${shown.length ? shown.map((e) => `
        <div class="ev ${e.kind}"><time>${new Date(e.ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"})}</time>
          <span class="ph">${esc(phaseName[e.phase_id] || "")}</span>
          <div class="body"><span class="kind">${esc(e.title)}</span>${esc(e.text)}</div></div>`).join("")
        : '<p class="empty" style="padding:0">No activity matches these filters.</p>'}</div>` : `
      <div class="files">
        <div class="flist">${d.files.map((f) => `<button class="mono ${f === state.file ? "on" : ""}" data-f="${esc(f)}">${esc(f)}</button>`).join("") || '<p class="empty" style="padding:0">No files yet.</p>'}</div>
        <pre id="file">${state.file ? esc(state.fileText) : "Pick a file to read it."}</pre>
      </div>`}`;

  $$(".station[data-p]").forEach((el) => el.onclick = () => {
    const pid = Number(el.dataset.p);
    state.station = state.station === pid ? null : pid;
    render();
  });
  $$(".tab").forEach((el) => el.onclick = () => { state.tab = el.dataset.tab; render(); });
  $$(".chip").forEach((el) => el.onclick = () => {
    const x = el.dataset.kind;
    state.kinds.has(x) ? state.kinds.delete(x) : state.kinds.add(x);
    render();
  });
  const clear = $("[data-clear]"); if (clear) clear.onclick = () => { state.station = null; render(); };
  $$(".flist button").forEach((el) => el.onclick = async () => {
    state.file = el.dataset.f;
    state.fileText = await fetch(`/api/file?job=${encodeURIComponent(j.id)}&path=${encodeURIComponent(state.file)}`).then((r) => r.text());
    render();
  });
  $$("[data-copy]").forEach((el) => el.onclick = async () => {
    try { await navigator.clipboard.writeText(el.dataset.copy); el.textContent = "Copied"; }
    catch (e) { el.textContent = "Copy failed"; }
    setTimeout(() => el.textContent = "Copy", 1500);
  });
}

function cmd(c, what) {
  return `<div class="cmd"><code>${esc(c)}</code><button class="copy" data-copy="${esc(c)}">Copy</button><span>${esc(what)}</span></div>`;
}

function stationPanel(p, gs) {
  const end = p.ended_at || Date.now()/1000;
  return `<div class="panel">
    <h3>${esc(stationName(p.name))}</h3>
    <div class="sub">${p.kind === "agent" ? "Agent step" : "Code step"} by ${esc(p.owner || "-")} · ${esc(p.status)} · ${dur(end - p.started_at)}
      ${p.context_window ? ` · context ${k(p.context_tokens)} of ${k(p.context_window)}` : ""}</div>
    ${p.detail ? `<div class="text">${esc(p.detail)}</div>` : ""}
    ${gs.length ? `<ul class="gates">${gs.map((g) => `<li><span class="${g.passed ? "y" : "n"}">${g.passed ? "✓" : "✕"}</span>
      <div>${esc(g.name)}${g.detail ? `<small>${esc(g.detail)}</small>` : ""}</div></li>`).join("")}</ul>` : ""}
  </div>`;
}

/* ---------- events ---------- */
function summarize(e) {
  let d = {}; try { d = JSON.parse(e.data); } catch (x) {}
  if (e.type === "log") {
    if (d.check) return { kind: "log", title: `${d.passed ? "✓" : "✕"} ${d.check}`,
                          text: ` ${d.command || ""}${d.passed ? "" : "\n" + String(d.output || "").slice(-600)}` };
    if (d.agent) return { kind: "log", title: `${d.resume ? "resume" : "start"} ${d.agent}`,
                          text: ` ${d.runner || ""} ${d.model || ""}${d.attempt > 1 ? `, attempt ${d.attempt}` : ""}` };
    const msg = d.msg || d.message || d.event;
    const rest = Object.entries(d).filter(([k]) => !["type", "msg", "message", "event"].includes(k))
      .map(([k, v]) => `${k}=${typeof v === "string" ? v.slice(0, 300) : JSON.stringify(v)}`).join("  ");
    return { kind: "log", title: msg ? String(msg).slice(0, 120) : "log", text: (msg ? " " : "") + rest };
  }
  if (e.type === "message_end" || e.type === "assistant") {
    const m = d.message || {}; const c = m.content || [];
    const tools = c.filter((x) => x.type === "tool_use" || x.type === "toolCall").map((x) => x.name);
    const text = c.map((x) => x.text || "").join(" ").trim().slice(0, 600);
    return { kind: "message", title: m.role || "agent", text: text + (tools.length ? `  [calls ${tools.join(", ")}]` : "") };
  }
  if (e.type === "tool_execution_start" || e.type === "tool_execution_end")
    return { kind: "tool", title: (d.toolName || "tool") + (e.type.endsWith("end") ? " done" : ""),
             text: e.type.endsWith("start") ? JSON.stringify(d.args || "").slice(0, 240) : "" };
  if (e.type === "result") return { kind: "result", title: "result", text: String(d.result || "").slice(0, 600) };
  return { kind: "log", title: e.type, text: d.text ? d.text.slice(0, 300) : "" };
}

async function loadEvents(id) {
  let fresh = false;
  for (;;) {
    const rows = await fetch(`/api/jobs/${encodeURIComponent(id)}/events?after=${state.lastEvent}`).then((r) => r.json());
    if (!rows.length || state.selected !== id) break;
    fresh = true;
    state.lastEvent = rows[rows.length - 1].id;
    rows.forEach((e) => state.events.unshift({ ...e, ...summarize(e) }));
    if (rows.length < 500) break;
  }
  if (state.events.length > 3000) state.events.length = 3000;
  return fresh;
}

async function tick() {
  try { await loadJobs(); if (state.selected) await select(state.selected); } catch (e) {}
  setTimeout(tick, 1000);
}
tick();
</script>
